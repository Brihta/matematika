<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moj ljubljenček</title>
<!-- Teče v iframu na glavni strani (pet.js), tako kot lik.html: bazo kliče
     prek parent.petApi, po vsaki spremembi pokliče parent.petChanged(stanje).
     Kaj je odklenjeno in kdaj ljubljenček zraste, odloča baza
     (supabase_ljubljencek.sql) — ta stran samo riše in pošlje izbiro. -->
<style>
html { touch-action: manipulation; }
:root {
  --cream: #fdfcf3; --sand: #f6e5cd; --sand-2: #ecd9bc; --lime: #dde236;
  --leaf: #9ac334; --leaf-2: #7fa82a; --forest: #05270b; --muted: #5d6b52;
  --grad: linear-gradient(135deg, #a9cf45, #8ab52c);
  --glow: rgba(122,160,40,0.30);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, sans-serif; color: var(--forest);
  background: radial-gradient(900px 500px at 30% -10%, rgba(221,226,54,0.18), transparent 65%), var(--cream);
  overflow-y: auto;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 22px 18px 40px; }
h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: -.01em; padding-right: 48px; }
h1 small { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-top: 2px; }
h2 { font-size: .74rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

.grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; margin-top: 16px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
.card { background: #fffef8; border-radius: 20px; box-shadow: 0 2px 14px rgba(5,39,11,.06), inset 0 0 0 1px var(--sand-2); padding: 16px; }

/* ljubljenček */
.stage-card { position: sticky; top: 12px; text-align: center; }
@media (max-width: 820px) { .stage-card { position: static; } }
.pet-big { width: 100%; max-width: 300px; aspect-ratio: 1; margin: 0 auto; }
.pet-big svg { width: 100%; height: 100%; display: block; }
.pet-big .pa-egg { transform-origin: 100px 182px; animation: wob 2.6s ease-in-out infinite; }
@keyframes wob { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-5deg); } 84% { transform: rotate(5deg); } 92% { transform: rotate(-3deg); } }
.pet-big.pop { animation: pop .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { from { transform: scale(.85); } }
.pet-name { font-size: 1.4rem; font-weight: 900; margin-top: 4px; min-height: 1.6rem; }
.pet-stage { display: inline-block; margin-top: 4px; background: var(--sand); border-radius: 999px; padding: 4px 12px; font-size: .78rem; font-weight: 800; }

.growth { margin-top: 14px; text-align: left; }
.growth-bar { position: relative; height: 12px; background: var(--sand); border-radius: 999px; overflow: hidden; }
.growth-fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--lime), var(--leaf)); border-radius: 999px; transition: width .6s; }
.growth-marks { display: flex; justify-content: space-between; margin-top: 6px; font-size: .68rem; font-weight: 700; color: var(--muted); }
.growth-marks span.on { color: var(--forest); }
.growth-txt { font-size: .85rem; font-weight: 700; margin-top: 8px; }
.growth-txt small { display: block; color: var(--muted); font-weight: 600; margin-top: 2px; }

/* urejevalnik */
.section { margin-bottom: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.species-btn { flex: 1 1 110px; background: var(--cream); border: 2px solid var(--sand-2); border-radius: 16px; padding: 6px 6px 8px; cursor: pointer; font: 800 .82rem system-ui, sans-serif; color: var(--forest); transition: transform .12s, border-color .12s, box-shadow .12s; }
.species-btn svg { width: 86px; height: 86px; display: block; margin: 0 auto; }
.species-btn:hover:not(:disabled) { border-color: var(--leaf); transform: translateY(-2px); }
.species-btn.on { border-color: var(--leaf-2); background: #f4f8e3; box-shadow: 0 4px 14px var(--glow); }
.species-btn:disabled { cursor: default; opacity: .45; }
.pick .species-btn { flex: 1 1 160px; padding: 12px 8px 14px; font-size: 1rem; }
.pick .species-btn svg { width: 150px; height: 150px; }
.note { font-size: .8rem; color: var(--muted); font-weight: 600; margin-top: 6px; }
/* bližnjica v zavihek Moj lik (svet.js) */
.to-lik { margin-top: 8px; background: none; border: 0; padding: 0; font: 800 .85rem inherit; font-family: inherit; color: var(--forest); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.sw { position: relative; width: 46px; height: 46px; border-radius: 14px; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--sand-2); cursor: pointer; transition: transform .12s, box-shadow .12s; }
.sw:hover:not(.locked) { transform: translateY(-2px); }
.sw.on { box-shadow: 0 0 0 3px var(--leaf-2), 0 4px 12px var(--glow); }
.sw.locked { cursor: not-allowed; opacity: .45; }
.sw .lock { position: absolute; inset: auto -6px -6px auto; background: var(--forest); color: #fff; border-radius: 999px; font-size: .62rem; font-weight: 800; padding: 2px 5px; }
.chip { position: relative; background: var(--cream); border: 2px solid var(--sand-2); border-radius: 999px; padding: 8px 14px; font: 800 .82rem system-ui, sans-serif; color: var(--forest); cursor: pointer; }
.chip.on { background: var(--grad); border-color: transparent; box-shadow: 0 4px 12px var(--glow); }
.chip.locked { cursor: not-allowed; color: #9aa492; }
.chip .lock { font-size: .66rem; color: var(--muted); margin-left: 4px; }

.name-in { width: 100%; max-width: 280px; font: 800 1.05rem system-ui, sans-serif; color: var(--forest); background: var(--cream); border: 2px solid var(--sand-2); border-radius: 14px; padding: 10px 12px; }
.name-in:focus { outline: none; border-color: var(--leaf); box-shadow: 0 0 0 4px rgba(154,195,52,.2); }
.msg { min-height: 1.1em; font-size: .8rem; font-weight: 700; color: #b5382b; margin-top: 4px; }

/* mejniki */
.ms { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 520px) { .ms { grid-template-columns: 1fr; } }
.m { display: flex; gap: 10px; align-items: center; background: var(--cream); border: 2px solid var(--sand-2); border-radius: 14px; padding: 8px 10px; }
.m.done { background: #f1f7dc; border-color: var(--leaf); }
.m-ico { width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center; font-weight: 900; font-size: 1.1rem; background: var(--sand); }
.m.done .m-ico { background: var(--grad); }
.m-body { flex: 1; min-width: 0; }
.m-t { font-weight: 800; font-size: .88rem; }
.m-s { font-size: .72rem; color: var(--muted); font-weight: 600; line-height: 1.35; }
.m-s b { color: var(--forest); }
.m-s .ok { color: var(--leaf-2); }
.m-go { flex-shrink: 0; background: var(--grad); border: 0; border-radius: 10px; padding: 7px 10px; font: 800 .74rem system-ui, sans-serif; color: var(--forest); cursor: pointer; box-shadow: 0 3px 10px var(--glow); }
.m-go:hover { transform: translateY(-1px); }
.rule { font-size: .74rem; color: var(--muted); font-weight: 600; margin-top: 10px; line-height: 1.45; }

/* zbirka */
.coll { display: flex; gap: 10px; flex-wrap: wrap; }
.coll-it { width: 110px; text-align: center; font-size: .74rem; font-weight: 700; }
.coll-it svg { width: 100px; height: 100px; }

/* priboljški in trgovina */
.treats { margin-top: 14px; display: flex; align-items: center; gap: 10px; background: var(--sand); border-radius: 14px; padding: 10px 12px; text-align: left; }
.treats .ico { font-size: 1.7rem; }
.treats b { font-size: 1.25rem; font-weight: 900; }
.treats small { display: block; color: var(--muted); font-weight: 700; font-size: .74rem; }
.today-bar { height: 6px; background: #fffef8; border-radius: 999px; margin-top: 5px; overflow: hidden; }
.today-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--lime), var(--leaf)); border-radius: 999px; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.it { background: var(--cream); border: 2px solid var(--sand-2); border-radius: 16px; padding: 6px 6px 8px; text-align: center; }
.it.on { border-color: var(--leaf-2); background: #f4f8e3; }
.it svg { width: 96px; height: 96px; display: block; margin: 0 auto; }
.it .nm { font-weight: 800; font-size: .8rem; margin: 2px 0 6px; }
.it button { width: 100%; border: 0; border-radius: 10px; padding: 7px 6px; font: 800 .76rem system-ui, sans-serif; cursor: pointer; }
.it .buy { background: var(--grad); color: var(--forest); box-shadow: 0 3px 10px var(--glow); }
.it .buy:disabled { background: var(--sand); color: #9aa492; box-shadow: none; cursor: not-allowed; }
.it .wear { background: #fffef8; color: var(--forest); box-shadow: inset 0 0 0 2px var(--leaf); }
.it.on .wear { background: var(--forest); color: var(--cream); box-shadow: none; }
.comp { display: flex; gap: 10px; flex-wrap: wrap; }
.comp .it { width: 132px; }
.empty { text-align: center; padding: 40px 10px; color: var(--muted); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 140px); background: var(--forest); color: var(--cream); border-radius: 14px; padding: 10px 16px; font-weight: 800; transition: transform .3s; z-index: 10; }
.toast.on { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Nalagam …</div></div>
<div class="toast" id="toast"></div>
<script src="pet-art.js"></script>
<script>
const A = PetArt;
const api = () => { try { return parent.petApi; } catch (e) { return null; } };
// je v oknu Moj svet tudi zavihek z likom (svet.js)
const hasLik = () => { try { return !!(parent.Svet && parent.Svet.has('lik')); } catch (e) { return false; } };
const GROUPS = [['d10', 'Do 10'], ['b20', 'Do 20 brez prehoda'], ['pr', 'Do 20 s prehodom']];
const OPS = { p: '+', m: '−' };
// privzeti videz novega jajčka po vrsti — samo proste barve
const START = { zmaj: 'gozd', lisica: 'med', sova: 'nebo', macka: 'oblak' };

let S = null;          // pet_state iz baze
let draft = null;      // videz na zaslonu (pred odgovorom baze)
let saving = false, lastStage = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }

async function load() {
  const a = api();
  if (!a || !a.profile()) { $('app').innerHTML = '<div class="empty">Za ljubljenčka se prijavi.</div>'; return; }
  const st = await a.rpc('pet_state', { p_student: a.profile().id });
  if (!st || !st.season) {
    $('app').innerHTML = st && !st.unreachable
      ? '<div class="empty">🥚 Sezona se še ni začela. Ljubljenček te čaka!</div>'
      : '<div class="empty">⚠️ Strežnik ni dosegljiv. Poskusi znova čez trenutek.</div>';
    return;
  }
  setState(st);
}
window.petReload = load;

function setState(st) {
  const grew = lastStage && st.stage !== lastStage;
  S = st; draft = st.pet ? Object.assign({}, st.pet) : null;
  lastStage = st.stage;
  render();
  if (grew) { const big = document.querySelector('.pet-big'); if (big) big.classList.add('pop'); }
  try { parent.petChanged && parent.petChanged(st); } catch (e) {}
}

async function save(next, okMsg) {
  if (saving) return;
  const a = api(); if (!a) return;
  const prev = draft;
  draft = next; render();                       // takoj pokaži, baza potrdi
  saving = true;
  const r = await a.rpc('pet_save', { p_student: a.profile().id, p_species: next.species, p_name: next.name || '',
                                      p_body: next.body, p_belly: next.belly, p_eyes: next.eyes, p_pattern: next.pattern });
  saving = false;
  if (!r || r.unreachable) { draft = prev; render(); toast('⚠️ Ni povezave — poskusi znova.'); return; }
  if (r.error) {
    draft = prev; render();
    const m = { IME: 'Ime naj ima samo črke (do 14).', ZAKLENJENO: 'To se odklene z mejnikom.', IZVALJEN: 'Ljubljenček je že buden — vrsta ostane.', VRSTA: 'Te vrste ni.' }[r.error] || 'Ni šlo.';
    if (r.error === 'IME') { const el = $('nameMsg'); if (el) el.textContent = m; } else toast(m);
    return;
  }
  setState(r);
  if (okMsg) toast(okMsg);
}

function render() {
  if (!S) return;
  if (!draft) return renderPick();
  const count = S.count, stage = S.stage;
  const next = A.STAGES.find(x => x.from > count), W = A.words(draft.species);
  const sp = A.SPECIES.find(x => x.id === draft.species) || A.SPECIES[0];
  $('app').innerHTML = `
    <h1>🐣 Moj ljubljenček<small>Sezona ${esc(S.season.name)} · raste, ko računaš do 20 hitro in brez napak</small></h1>
    <div class="grid">
      <div class="card stage-card">
        <div class="pet-big">${A.draw(draft, stage)}</div>
        <div class="pet-name">${esc(draft.name) || `<span style="color:var(--muted)">${sp.name}</span>`}</div>
        <span class="pet-stage">${A.stageName(stage, draft.species)}</span>
        <div class="growth">
          <div class="growth-bar"><div class="growth-fill" style="width:${count / A.MILESTONES * 100}%"></div></div>
          <div class="growth-marks">${A.STAGES.map(x => `<span class="${count >= x.from ? 'on' : ''}">${x.from ? x.from : W.icon}</span>`).join('')}</div>
          <div class="growth-txt">${count} / ${A.MILESTONES} mejnikov${next
            ? `<small>Še ${next.from - count} do stopnje »${next.name}«${count === 0 ? ` — ob prvem mejniku ${W.wait}!` : ''}</small>`
            : '<small>Končna oblika! Bravo, vse računi do 20 znaš na pamet.</small>'}</div>
        </div>
        ${treatsBox()}
      </div>
      <div>
        <div class="card section">
          <h2>Ime</h2>
          <input class="name-in" id="nameIn" maxlength="14" placeholder="Kako mu bo ime?" value="${esc(draft.name)}">
          <div class="msg" id="nameMsg"></div>
          <h2 style="margin-top:12px">Vrsta</h2>
          <div class="row">${A.SPECIES.map(x => `<button class="species-btn${x.id === draft.species ? ' on' : ''}" data-sp="${x.id}" ${count > 0 && x.id !== draft.species ? 'disabled' : ''}>
              ${A.draw({ ...draft, species: x.id }, count > 0 ? 'odrasel' : 'jajce')}${x.name}</button>`).join('')}</div>
          <div class="note">${count > 0 ? `Ljubljenček ${W.waitPast}, zato vrsta ostane ista vso sezono.` : 'Dokler spi, lahko vrsto še zamenjaš.'}</div>
        </div>
        <div class="card section">
          <h2>Barva</h2>
          <div class="row">${swatches('body', A.BODY, count)}</div>
          <h2 style="margin-top:12px">Trebušček</h2>
          <div class="row">${swatches('belly', A.BELLY, count)}</div>
          <h2 style="margin-top:12px">Oči</h2>
          <div class="row">${chips('eyes', A.EYES, count)}</div>
          <h2 style="margin-top:12px">Vzorec</h2>
          <div class="row">${chips('pattern', A.PATTERN, count)}</div>
          <div class="note">🔒 Vsak mejnik odklene nekaj novega.</div>
        </div>
        <div class="card section">
          <h2>Mejniki</h2>
          <div class="ms">${(S.milestones || []).map(milestone).join('')}</div>
          <div class="rule">Mejnik dosežeš, ko v skupini vsak račun vsaj enkrat rešiš pravilno, imaš vsaj 20 odgovorov,
            vsaj 90 % pravilnih in skoraj vse (80 %) hitreje kot v 3 sekundah. Šteje samo <b>tipkovnica</b> —
            v kvizu lahko odgovor uganeš.</div>
        </div>
        ${shopCard(stage)}
        ${companionCard(stage)}
      </div>
    </div>`;
  wire();
}

const tw = n => { const m = n % 100; return m === 1 ? 'priboljšek' : m === 2 ? 'priboljška' : m === 3 || m === 4 ? 'priboljški' : 'priboljškov'; };
function treatsBox() {
  const t = S.treats || { balance: 0, today: 0, cap: 20 };
  return `<div class="treats"><span class="ico">🍎</span><div style="flex:1"><b>${t.balance}</b> ${tw(t.balance)}
    <small>Danes ${t.today} / ${t.cap} · za vajo do 20 (tipkovnica več kot kviz)</small>
    <div class="today-bar"><i style="width:${Math.min(100, t.today / t.cap * 100)}%"></i></div></div></div>`;
}
/* Trgovina: predmet pokažemo na tvojem ljubljenčku (dokler spi, ga ne more nositi,
   zato ga pokažemo odraslega). Kupljeno ostane za vedno. */
function shopCard(stage) {
  const owned = new Set(S.owned || []), bal = (S.treats || {}).balance || 0, eq = draft.equip || {};
  // v jajcu, lupini ali košarici se predmet ne vidi dobro — pokažemo ga na odraslem
  const look = stage === 'jajce' || stage === 'mladicek' ? 'odrasel' : stage;
  const bySlot = {};
  (S.shop || []).forEach(x => (bySlot[x.slot] = bySlot[x.slot] || []).push(x));
  return `<div class="card section"><h2>Trgovina za ljubljenčka</h2>${Object.keys(A.SLOT_NAME).filter(sl => bySlot[sl]).map(sl =>
    `<div class="note" style="margin:8px 0 6px;font-weight:800;color:var(--forest)">${A.SLOT_NAME[sl]}</div><div class="shop">${bySlot[sl].map(x => {
      const own = owned.has(x.id), on = eq[sl] === x.id, nm = (A.ACC[x.id] || {}).name || x.id;
      const pic = A.draw({ ...draft, equip: { ...eq, [sl]: x.id } }, look);
      const btn = own
        ? `<button class="wear" data-wear="${x.id}" data-slot="${sl}">${on ? '✓ Nosi' : 'Obleci'}</button>`
        : `<button class="buy" data-buy="${x.id}" ${bal < x.price ? 'disabled' : ''}>🍎 ${x.price}</button>`;
      return `<div class="it${on ? ' on' : ''}">${pic}<div class="nm">${nm}</div>${btn}</div>`;
    }).join('')}</div>`).join('')}
    <div class="note">${stage === 'jajce' ? 'Ljubljenček še spi in ne more nositi ničesar — predmete pa lahko že kupiš.' : 'Klikni še enkrat, da predmet snameš.'}</div></div>`;
}
/* Kdo gre z likom (vitez …): ta ljubljenček ali kateri iz prejšnjih sezon. */
function companionCard(stage) {
  const cur = S.companion, list = [];
  list.push({ ...draft, season: S.season.id, season_name: S.season.name, stage });
  (S.collection || []).forEach(c => list.push(c));
  return `<div class="card section"><h2>Spremljevalec tvojega lika</h2><div class="comp">${list.map(c => {
      const on = cur && cur.season === c.season, egg = c.stage === 'jajce';
      return `<div class="it${on ? ' on' : ''}">${A.draw(c, c.stage)}<div class="nm">${esc(c.name) || (A.SPECIES.find(x => x.id === c.species) || {}).name}
        <br><span style="color:var(--muted);font-weight:700">${esc(c.season_name)}</span></div>
        ${egg ? `<button class="wear" disabled>${A.words(c.species).still}</button>`
              : `<button class="wear" data-comp="${on ? '' : c.season}" title="${on ? 'Klikni, da ostane doma' : 'Klikni, da stoji ob tvojem liku'}">${on ? '✓ Gre s tabo' : 'Vzemi s seboj'}</button>`}</div>`;
    }).join('')}</div>
    <div class="note">Tvoj ljubljenček lahko stoji ob tvojem liku, če želiš.</div>
    ${hasLik() ? '<button class="to-lik" id="toLik" type="button">Poglej svoj lik ›</button>' : ''}</div>`;
}
/* Nakup, oprema, spremljevalec: baza preveri in vrne novo stanje. */
async function act(fn, params, okMsg) {
  const a = api(); if (!a || saving) return;
  saving = true;
  const r = await a.rpc(fn, { p_student: a.profile().id, ...params });
  saving = false;
  if (!r || r.unreachable) { toast('⚠️ Ni povezave — poskusi znova.'); return; }
  if (r.error) {
    toast({ PREMALO: 'Premalo priboljškov — vadi še malo!', ZE_IMAS: 'To že imaš.', JAJCE: 'Ljubljenček še spi — najprej se mora zbuditi.',
            NI_LJUBLJENCKA: 'Najprej izberi ljubljenčka.' }[r.error] || 'Ni šlo.');
    return;
  }
  setState(r);
  if (okMsg) toast(okMsg);
}

function swatches(kind, list, count) {
  return Object.entries(list).map(([k, v]) => {
    const ok = A.allowed(kind, k, count), on = draft[kind] === k;
    return `<button class="sw${on ? ' on' : ''}${ok ? '' : ' locked'}" data-k="${kind}" data-v="${k}" title="${v.name}${ok ? '' : ' — mejnik ' + A.unlockAt(k)}"
      style="background:${v.c}">${ok ? '' : `<span class="lock">🔒${A.unlockAt(k)}</span>`}</button>`;
  }).join('');
}
function chips(kind, list, count) {
  return Object.entries(list).map(([k, v]) => {
    const ok = A.allowed(kind, k, count), on = draft[kind] === k;
    return `<button class="chip${on ? ' on' : ''}${ok ? '' : ' locked'}" data-k="${kind}" data-v="${k}">${v.name}${ok ? '' : `<span class="lock">🔒${A.unlockAt(k)}</span>`}</button>`;
  }).join('');
}
function milestone(m) {
  const name = (GROUPS.find(g => g[0] === m.g) || [, m.g])[1] + ' ' + OPS[m.op];
  if (m.done) return `<div class="m done"><div class="m-ico">✓</div><div class="m-body"><div class="m-t">${name}</div><div class="m-s">Obvladaš!</div></div></div>`;
  const acc = m.answers ? Math.round(m.correct / m.answers * 100) : null;
  const fast = m.timed ? Math.round(m.fast / m.timed * 100) : null;
  const bit = (txt, ok) => `<span class="${ok ? 'ok' : ''}">${txt}</span>`;
  const sub = m.answers
    ? [bit(`računi <b>${m.facts_done}/${m.facts_total}</b>`, m.facts_done >= m.facts_total),
       bit(`odgovori <b>${m.answers}</b>/20`, m.answers >= 20),
       bit(`pravilno <b>${acc} %</b>`, acc >= 90),
       bit(`hitro <b>${fast === null ? '—' : fast + ' %'}</b>`, fast !== null && fast >= 80)].join(' · ')
    : `Še brez vaje · ${m.facts_total} računov`;
  return `<div class="m"><div class="m-ico">${OPS[m.op]}</div><div class="m-body"><div class="m-t">${name}</div><div class="m-s">${sub}</div></div>
    <button class="m-go" data-g="${m.g}" data-op="${m.op}">Vadi</button></div>`;
}

function renderPick() {
  $('app').innerHTML = `
    <h1>🐾 Izberi svojega ljubljenčka<small>Sezona ${esc(S.season.name)} · zmajček in sovica se izvalita iz jajca, lisička in mucek spita v košarici</small></h1>
    <div class="card pick" style="margin-top:16px">
      <div class="row">${A.SPECIES.map(x => `<button class="species-btn" data-new="${x.id}">
        ${A.draw({ species: x.id, body: START[x.id] }, 'jajce')}${x.name}</button>`).join('')}</div>
      <div class="note">Ko rešiš prvi mejnik pri računih do 20, se jajce izvali ali se ljubljenček zbudi. Potem raste z vsakim novim mejnikom.</div>
    </div>`;
  document.querySelectorAll('[data-new]').forEach(b => b.addEventListener('click', () => {
    const sp = b.dataset.new;
    save({ species: sp, name: '', body: START[sp], belly: 'krema', eyes: 'rjave', pattern: 'brez' }, A.words(sp).mine);
  }));
}

function wire() {
  document.querySelectorAll('[data-sp]').forEach(b => b.addEventListener('click', () => {
    if (b.disabled || b.dataset.sp === draft.species) return;
    save({ ...draft, species: b.dataset.sp });
  }));
  document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k, v = b.dataset.v;
    if (b.classList.contains('locked')) { toast(`🔒 Odklene se pri ${A.unlockAt(v)}. mejniku.`); return; }
    if (draft[k] === v) return;
    save({ ...draft, [k]: v });
  }));
  const ni = $('nameIn');
  const commit = () => { const v = ni.value.trim(); if (v !== (draft.name || '')) { $('nameMsg').textContent = ''; save({ ...draft, name: v }, 'Ime shranjeno.'); } };
  ni.addEventListener('blur', commit);
  ni.addEventListener('keydown', e => { if (e.key === 'Enter') ni.blur(); });
  document.querySelectorAll('[data-buy]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.buy, nm = (A.ACC[id] || {}).name || id;
    act('pet_buy', { p_item: id }, `Kupljeno: ${nm}! 🎉`);
  }));
  document.querySelectorAll('[data-wear]').forEach(b => b.addEventListener('click', () => {
    if (S.stage === 'jajce') { toast('Ljubljenček še spi in ne more nositi ničesar.'); return; }
    const on = (draft.equip || {})[b.dataset.slot] === b.dataset.wear;
    act('pet_equip', { p_slot: b.dataset.slot, p_item: on ? null : b.dataset.wear });
  }));
  const tl = $('toLik');
  if (tl) tl.addEventListener('click', () => parent.Svet.open('lik'));
  document.querySelectorAll('[data-comp]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.comp;
    act('pet_set_companion', { p_season: v ? +v : null }, v ? 'Zdaj gre s tvojim likom! 🛡️' : 'Ostane doma.');
  }));
  document.querySelectorAll('.m-go').forEach(b => b.addEventListener('click', () => {
    const a = api(); if (a && a.practice) a.practice(b.dataset.g, b.dataset.op);
  }));
}

load();
</script>
</body>
</html>
