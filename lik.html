<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brihta — moj lik</title>
<!--
  Moj lik: album sličic, oprema (trgovina), videz in liki.
  Odpre se v oknu čez aplikacijo (album.js) in z bazo govori prek aplikacije:
  parent.albumApi (ista stran, isti izvor). Vse, kar
  šteje — katere sličice, koliko cekinov, kaj je kupljeno — odloča baza
  (supabase_album.sql). Tukaj so samo slike, besedila in prikaz.
  Zasnova: gamifikacija/README.md (lokalno).
-->
<style>
  :root {
    --bg: #f6efe3; --card: #ffffff; --paper: #fffaf0; --ink: #2b2233; --muted: #7a7184; --line: #e6dac6;
    --accent: #f08c2e; --accent-soft: #fff1e2; --purple: #6a4fc0; --purple-soft: #efeafd; --gold: #f4c542; --ok: #3f9a5a;
    --navaden: #6f8f5e; --redek: #2a7fcf; --epski: #8e44ad; --nagrada: #c0392b;
    --slot: #f3e8d4; --slot-line: #cdbd9f; --shadow: 0 10px 30px rgba(80, 50, 30, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a22; --card: #26232e; --paper: #2b2733; --ink: #f1ecf6; --muted: #a59db0; --line: #3c3644;
      --accent-soft: #3a2a1c; --purple-soft: #2e2840; --slot: #34303d; --slot-line: #4c4558; --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }

  header { padding-right: 52px; }   /* prostor za ✕ okna v aplikaciji */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 60px; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 0; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand-mark { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 1.2rem; }
  .brand b { display: block; }
  .season { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 700; font-size: .9rem; }
  .season .ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); }
  .season small { color: var(--muted); font-weight: 600; }
  .wallet { display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--gold); border-radius: 999px; padding: 5px 14px 5px 7px; font-weight: 800; font-size: 1.05rem; position: relative; }
  .coin { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, var(--gold) 60%, #d89936); display: grid; place-items: center; color: #8a5a10; font-size: .75rem; box-shadow: inset 0 0 0 2px #d89936, inset 0 0 0 5px #f4c542, inset 0 0 0 6px #d89936; flex: 0 0 auto; }
  .wallet.bump { animation: bump .5s; }
  @keyframes bump { 40% { transform: scale(1.14); } }
  .plus { position: absolute; right: 10px; top: -4px; color: var(--ok); font-weight: 900; animation: rise 1.1s ease-out forwards; pointer-events: none; }
  @keyframes rise { to { transform: translateY(-34px); opacity: 0; } }
  .env-btn { border: 0; background: var(--accent); color: #fff; font-weight: 800; border-radius: 999px; padding: 8px 14px 8px 12px; display: flex; align-items: center; gap: 8px; }
  .env-btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .env-btn .n { background: #fff; color: var(--accent); border-radius: 999px; min-width: 22px; height: 22px; display: grid; place-items: center; font-size: .8rem; }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 0 0 8px rgba(240,140,46,.18); } }

  main { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start; }

  /* ── lik ── */
  .stage { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); }
  .view { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1; }
  .view svg { width: 100%; height: 100%; display: block; }
  .trying { position: absolute; z-index: 2; top: 10px; left: 10px; background: rgba(43,34,51,.8); color: #fff; font-size: .75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; display: none; }
  .trying.on { display: block; }
  .rank { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; margin: 12px 2px 0; }
  .rank .chev { width: 40px; height: 40px; }
  .rank { cursor: pointer; border-radius: 12px; }
  .rank:hover { background: var(--bg); }
  .aura { position: absolute; inset: 0; pointer-events: none; }
  .aura svg { width: 100%; height: 100%; }
  .aura path { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes twinkle { 50% { opacity: .2; transform: scale(.6); } }
  .rank b { display: block; }
  .rank small { color: var(--muted); font-size: .82rem; }
  .rank .bar { margin-top: 4px; }
  .action { margin-top: 12px; min-height: 92px; background: var(--bg); border-radius: 14px; padding: 12px; }
  .action .hint { color: var(--muted); text-align: center; padding: 20px 0; font-size: .95rem; }
  .act-title { display: flex; align-items: center; gap: 8px; font-weight: 800; margin-bottom: 10px; flex-wrap: wrap; }
  .act-note { color: var(--muted); font-size: .88rem; margin: -4px 0 10px; }
  .btns { display: flex; gap: 8px; }
  .btn { flex: 1; border: 0; border-radius: 12px; padding: 12px; font-weight: 800; font-size: 1rem; text-decoration: none; text-align: center; }
  .btn-main { background: var(--accent); color: #fff; }
  .btn-main:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  .btn-ok { background: var(--ok); color: #fff; }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn-soft { background: var(--card); border: 1px solid var(--line); flex: 0 0 auto; padding: 12px 16px; }

  .bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 999px; transition: width .6s; }
  .rar { font-size: .66rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; color: #fff; }
  .rar.navaden { background: var(--navaden); } .rar.redek { background: var(--redek); } .rar.epski { background: var(--epski); } .rar.nagrada { background: var(--nagrada); }
  .price { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: .9rem; }
  .price .coin { width: 18px; height: 18px; font-size: .6rem; }

  /* ── desna stran ── */
  .side { min-width: 0; }
  .main-tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 5px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
  .mt { flex: 1; border: 0; background: none; border-radius: 12px; padding: 10px 12px; font-weight: 800; white-space: nowrap; color: var(--muted); }
  .mt.on { background: var(--purple); color: #fff; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 12px; }
  .tab { border: 1px solid var(--line); border-bottom: 0; background: var(--card); border-radius: 14px 14px 0 0; padding: 9px 14px 11px; font-weight: 800; font-size: .9rem; white-space: nowrap; display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .tab small { font-weight: 700; font-size: .72rem; background: var(--bg); padding: 1px 7px; border-radius: 999px; }
  .tab.on { background: var(--paper); color: var(--ink); transform: translateY(1px); }
  .tab.full small { background: var(--ok); color: #fff; }
  .page { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 20px; box-shadow: var(--shadow);
          background-image: radial-gradient(rgba(150,120,80,.08) 1px, transparent 1px); background-size: 18px 18px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); }
  .page-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 1.45rem; }
  .desc { color: var(--muted); margin: 6px 0 12px; max-width: 60ch; }
  .page-prog { display: flex; align-items: center; gap: 10px; font-weight: 800; max-width: 360px; }
  .page-prog .bar { flex: 1; }
  .reward { display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px dashed var(--slot-line); border-radius: 16px; padding: 8px 12px 8px 8px; max-width: 280px; text-align: left; }
  .reward .pic { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #fff6ea, #f6dcbc); flex: 0 0 auto; }
  .reward .pic svg { width: 100%; height: 100%; display: block; }
  .reward.locked .pic svg { filter: grayscale(1); opacity: .5; }
  .reward b { display: block; font-size: .95rem; }
  .reward small { color: var(--muted); font-size: .8rem; display: block; }
  .reward.open { border-style: solid; border-color: var(--ok); }
  .section-title { font-weight: 800; color: var(--purple); letter-spacing: .08em; text-transform: uppercase; font-size: .72rem; margin: 16px 0 10px; }
  .sgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .sgrid.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .sgrid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .slot { border: 0; background: none; padding: 0; text-align: center; }
  .slot .st { aspect-ratio: 1; position: relative; }
  .slot .st svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .slot .have svg { transform: rotate(var(--rot)); filter: drop-shadow(0 4px 4px rgba(60,40,20,.18)); }
  .slot .lbl { font-weight: 800; font-size: .8rem; margin-top: 4px; }
  .slot .num { color: var(--muted); font-size: .7rem; font-weight: 700; }
  .slot .waiting { position: absolute; inset: 0; display: grid; place-items: center; }
  .slot .waiting span { background: var(--accent); color: #fff; font-size: .66rem; font-weight: 800; padding: 3px 7px; border-radius: 999px; animation: pulse 1.4s infinite; }
  .slot.stuck .have svg { animation: stick .7s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes stick { 0% { transform: scale(1.8) rotate(-18deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: rotate(var(--rot)); } }

  .igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { position: relative; text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 16px; padding: 8px; transition: transform .12s; }
  .card:hover { transform: translateY(-2px); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .card .pic { aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #fff6ea, #f6dcbc); }
  .card .pic svg { width: 100%; height: 100%; display: block; }
  .card.lock .pic svg { filter: grayscale(.85); opacity: .55; }
  .card .nm { font-weight: 800; font-size: .9rem; margin: 8px 2px 6px; }
  .card .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tag { position: absolute; top: 14px; right: 14px; font-size: .66rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; }
  .tag.own { background: var(--purple-soft); color: var(--purple); }
  .tag.on { background: var(--ok); color: #fff; }
  .tag.lk { background: #fff; color: var(--nagrada); border: 1px solid var(--line); }
  .shop-note { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }

  .looks h3 { font-size: .95rem; margin: 14px 0 8px; } .looks h3:first-child { margin-top: 0; }
  .sw-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 42px; height: 42px; border-radius: 50%; border: 3px solid transparent; box-shadow: inset 0 0 0 2px rgba(0,0,0,.12); }
  .sw.on { border-color: var(--accent); }
  .chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-weight: 700; }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); }

  .chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .ch { border: 2px solid var(--line); border-radius: 18px; padding: 10px; background: var(--card); text-align: center; }
  .ch.on { border-color: var(--ok); }
  .ch .pic { aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #fff6ea, #f6dcbc); }
  .ch .pic svg { width: 100%; height: 100%; display: block; }
  .ch.future .pic svg { filter: brightness(0) opacity(.18); }
  .ch b { display: block; margin-top: 8px; font-size: 1.05rem; }
  .ch small { color: var(--muted); display: block; margin: 2px 0 8px; }
  .ch .btn { width: 100%; padding: 10px; font-size: .9rem; }
  .info { background: var(--purple-soft); color: var(--purple); border-radius: 14px; padding: 12px 14px; font-weight: 600; font-size: .92rem; margin-bottom: 14px; }

  .class-hero { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 22px; align-items: center; }
  .class-hero svg { width: 100%; height: auto; }
  .big-num { font-size: 2.2rem; font-weight: 900; line-height: 1.05; }

  /* okna */
  .modal { position: fixed; inset: 0; background: rgba(30,20,35,.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; overflow-y: auto; }
  .modal.on { display: flex; }
  .box { background: var(--card); border-radius: 22px; padding: 22px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); margin: auto; }
  .box.wide { max-width: 640px; }
  .box .art { width: 170px; height: 170px; margin: 0 auto 8px; border-radius: 18px; overflow: hidden; }
  .box .art svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .box .art.bgd { background: radial-gradient(circle at 50% 40%, #fff6ea, #f6dcbc); }
  .box h3 { margin: 6px 0 4px; font-size: 1.25rem; }
  .box p { color: var(--muted); margin: 4px 0 14px; }
  .checks { text-align: left; margin: 10px 0 14px; display: grid; gap: 8px; }
  .check { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: center; background: var(--bg); border-radius: 12px; padding: 8px 10px; font-size: .92rem; }
  .check .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: .8rem; }
  .check .ic.y { background: var(--ok); } .check .ic.n { background: var(--slot-line); }
  .check .bar { margin-top: 4px; height: 6px; }
  .tip { background: var(--purple-soft); color: var(--purple); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: .92rem; margin-bottom: 14px; }
  .env-art { width: 220px; margin: 0 auto 6px; }
  .env-art svg { width: 100%; height: auto; display: block; }
  .env-art.shake svg { animation: wob .6s ease-in-out infinite; }
  @keyframes wob { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  .reveal svg { animation: reveal .6s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes reveal { from { transform: translateY(60px) scale(.4) rotate(-20deg); opacity: 0; } }
  .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px 0 16px; }
  .summary div { background: var(--bg); border-radius: 12px; padding: 10px; }
  .summary b { display: block; font-size: 1.3rem; }
  .summary small { color: var(--muted); }
  .choose { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; text-align: left; }
  .opt { border: 2px solid var(--line); border-radius: 18px; padding: 10px; background: var(--card); }
  .opt .pic { aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #fff6ea, #f6dcbc); }
  .opt .pic svg { width: 100%; height: 100%; display: block; }
  .opt b { display: block; margin: 8px 0 2px; font-size: 1.05rem; }
  .opt small { color: var(--muted); display: block; margin-bottom: 10px; min-height: 3.6em; }
  .opt .btn { width: 100%; }
  .keepnote { color: var(--muted); font-size: .85rem; margin-top: 12px; }

  .burst { position: fixed; pointer-events: none; z-index: 70; width: 10px; height: 10px; border-radius: 50%; animation: burst .8s ease-out forwards; }
  @keyframes burst { to { transform: translate(var(--x), var(--y)) scale(.3); opacity: 0; } }
  .confetti { position: fixed; width: 10px; height: 14px; top: 40%; left: 50%; z-index: 75; pointer-events: none; border-radius: 2px; animation: fly 1.2s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 120px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; transition: transform .25s; z-index: 80; max-width: calc(100% - 32px); }
  .toast.on { transform: translate(-50%, 0); }

  @media (max-width: 920px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .stage { top: 0; z-index: 10; border-radius: 0 0 22px 22px; margin: 0 -16px; padding: 10px 16px; display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: center; }
    .stage .view { grid-row: span 2; }
    .rank { margin: 0; }
    .action { margin-top: 0; min-height: 0; }
    .action .hint { padding: 6px 0; }
    .page-head { grid-template-columns: minmax(0, 1fr); }
    .sgrid, .sgrid.six { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  }
  @media (max-width: 560px) {
    .stage { grid-template-columns: 120px minmax(0, 1fr); }
    .rank .chev { display: none; } .rank { grid-template-columns: minmax(0, 1fr); }
    .btns { flex-direction: column; }
    .sgrid, .sgrid.six, .sgrid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .slot .lbl { font-size: .7rem; }
    .igrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .season small, .brand small { display: none; }
    .choose, .summary { grid-template-columns: minmax(0, 1fr); }
    .class-hero { grid-template-columns: minmax(0, 1fr); }
    .class-hero svg { max-width: 180px; margin: 0 auto; display: block; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="season" id="season"></div>
    <div class="wallet" id="wallet"></div>
    <button class="env-btn" id="envBtn"></button>
  </header>
  <main>
    <section class="stage">
      <div class="view"><div class="trying" id="tryingBadge">Preizkušaš</div><div id="stageSvg" style="position:relative;height:100%"></div></div>
      <div class="rank" id="rank"></div>
      <div class="action" id="action"></div>
    </section>
    <section class="side">
      <nav class="main-tabs" id="mainTabs"></nav>
      <div id="view"></div>
    </section>
  </main>
</div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ════════════════ RISANJE ════════════════ */
const OL = '#3a2a3a';
function hex(c) { c = c.replace('#', ''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const shade = c => mix(c, '#2a1430', .28), light = c => mix(c, '#ffffff', .38);
let uid = 0;
function part(d, fill, o = {}) {
  const w = o.w || 5;
  let s = `<path d="${d}" fill="${fill}" stroke="${OL}" stroke-width="${w}" stroke-linejoin="round"/>`;
  if (o.shadow || o.hi) {
    const id = 'c' + (++uid);
    s += `<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">`
       + (o.shadow ? `<path d="${o.shadow}" fill="${shade(fill)}"/>` : '') + (o.hi ? `<path d="${o.hi}" fill="${light(fill)}" opacity=".8"/>` : '')
       + (o.inner || '') + `</g><path d="${d}" fill="none" stroke="${OL}" stroke-width="${w}" stroke-linejoin="round"/>`;
  }
  return s;
}
const line = (d, w = 3, c = OL) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const sparkle = (x, y, r, c = '#fff6b0') => `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r} Z" fill="${c}"/>`;
function star(cx, cy, r, fill, w = 2.5) {
  const p = [];
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; p.push((cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1)); }

    + part('M48 38 L38 56 L46 52 L52 58 L58 50 Z', '#fff', { w: 2.5 }) + line('M48 38 L48 14', 3) + part('M48 14 L68 21 L48 28 Z', '#e0574f', { w: 2.5 }),
  hello: () => star(60, 60, 34, '#f4c542', 3) + `<circle cx="50" cy="56" r="4" fill="${OL}"/><circle cx="70" cy="56" r="4" fill="${OL}"/>` + line('M50 68 Q60 76 70 68', 3),
  flake: () => [0, 60, 120].map(a => `<g transform="rotate(${a} 60 60)">` + line('M60 24 L60 96', 7, OL) + line('M60 24 L60 96', 3, '#fff') + line('M50 32 L60 42 L70 32', 3, '#fff') + line('M50 88 L60 78 L70 88', 3, '#fff') + `</g>`).join('')
};

/* ── album po sezonah ── */
/* Prag za "obvladano" (odločeno 5. 10. 2026, velja za sličice IN Brihtometer):
   vseh 10 računov predala vsaj enkrat pravilno, vsaj 20 odgovorov, 90 % pravilnih,
   80 % pravilnih pod 3 s. Štejejo samo tipkovnica, tekmovanje in bitka (ne kviz). */
/* ════════════════ ALBUM: besedila in slike sličic ════════════════
   Stanje (katere sličice ima otrok, napredek, cekini) pride iz baze —
   supabase_album.sql. Tukaj so samo imena, pogoji in slike. */
const MIN_N = 20, MIN_ACC = 90, MIN_FAST = 80, MIN_COVER = 10, COIN_PER = 20;
const PAGE_NAMES = { post: 'Poštevanke', tek: 'Tekmovanje', bit: 'Bitka', zve: 'Zvestoba', pog: 'Pogum' };
/* Strani, ki jih baza že podeljuje. Pogum in razredni cilj pridejo kasneje. */
const PAGES_LIVE = ['post', 'tek', 'bit', 'zve'];

function buildAlbum() {
  const pages = [];
  let no = 0;
  const add = p => { p.stickers.forEach(s => { s.no = ++no; s.page = p.id; s.state = 'none'; }); pages.push(p); };
  add({ id: 'post', name: 'Poštevanke',
    get desc() { return 'Sličico dobiš, ko poštevanko obvladaš v Brihtometru: vseh 10 računov vsaj enkrat pravilno, vsaj 20 odgovorov, 90 % pravilnih in 80 % hitreje kot v 3 sekundah. Šteje tipkovnica, tekmovanje in bitka — kviz ne. Zlata: znaš jo tudi 14 dni pozneje. Šteje samo, kar pokažeš v tej sezoni — tudi pri poštevankah, ki si jih ' + g('znal', 'znala') + ' že prej.'; },
    sections: [['x', 'Množenje ×'], ['d', 'Deljenje ÷']],
    stickers: ['x', 'd'].flatMap(op => Array.from({ length: 10 }, (_, i) => {
      const t = i + 1;
      return { id: `${op}${t}`, sec: op, t, op, label: `${t} ${op === 'x' ? '×' : '÷'}`, art: g => tableArt(t, op, g) };
    })) });
  /* Meje iz 1.066 iger (sept.–okt. 2026) — gl. supabase_album.sql. Šteje najboljša igra v sezoni. */
  add({ id: 'tek', name: 'Tekmovanje', desc: 'Medalje so tvoje osebne meje — tekmuješ s seboj. Šteje tvoja najboljša igra v sezoni.', stickers: [
    { id: 't0', label: 'Prvo tekmovanje', cond: 'Odigraj eno tekmovanje.', art: g => frame('#5a8fe0', ICON.stopwatch(), g) },
    { id: 't1', label: 'Lesena medalja', cond: 'Doseži 10 točk v eni igri.', best: 10, art: g => frame('#d9b48f', ICON.medal('#a07850'), g) },
    { id: 't2', label: 'Železna medalja', cond: 'Doseži 20 točk v eni igri.', best: 20, art: g => frame('#aab2bd', ICON.medal('#909090'), g) },
    { id: 't3', label: 'Bronasta medalja', cond: 'Doseži 40 točk v eni igri.', best: 40, art: g => frame('#e0b86a', ICON.medal('#c8a000'), g) },
    { id: 't4', label: 'Srebrna medalja', cond: 'Doseži 55 točk v eni igri.', best: 55, art: g => frame('#7fb4e6', ICON.medal('#2a7fcf'), g) },
    { id: 't5', label: 'Zlata medalja', cond: 'Doseži 75 točk v eni igri.', best: 75, art: g => frame('#f08a8a', ICON.medal('#c0392b'), g) },
    { id: 't6', label: 'Rekorder', cond: 'Izboljšaj svoj osebni rekord 5-krat.', records: 5, art: g => frame('#7cc35d', ICON.arrow(), g) },
    { id: 't7', label: 'Na lestvici', cond: 'Pridi na dnevno lestvico (10 najboljših dneva). Rezultat shrani na koncu igre.', art: g => frame('#8a6fe0', ICON.board(), g) }
  ] });
  add({ id: 'bit', name: 'Bitka', desc: 'Bitke s sošolci. Večina sličic je za sodelovanje, ne za zmago. Šteje bitka, v kateri odgovoriš vsaj 5-krat.', stickers: [
    { id: 'b0', label: 'Prva bitka', cond: 'Odigraj eno bitko.', art: g => frame('#e0574f', ICON.swords(), g) },
    { id: 'b1', label: '10 bitk', cond: 'Odigraj 10 bitk.', battles: 10, art: g => frame('#b05ad9', ICON.swords() + `<circle cx="60" cy="30" r="17" fill="#fff" stroke="${OL}" stroke-width="3"/>` + txt(60, 38, '10', 20, '#b05ad9', 0), g) },
    { id: 'b2', label: 'Stopničke', cond: 'Bodi med prvimi tremi v bitki z vsaj 4 igralci.', art: g => frame('#3fb8c9', ICON.podium(), g) },
    { id: 'b3', label: 'Ekipa', cond: 'Igraj s 5 različnimi sošolci (prijavljenimi).', mates: 5, art: g => frame('#7cc35d', ICON.people(), g) },
    { id: 'b4', label: 'Zmagovalec', cond: 'Zmagaj v eni bitki.', art: g => frame('#d9a441', ICON.trophy(), g) },
    { id: 'b5', label: 'Gostitelj', cond: 'Ustvari bitko, v kateri igrajo vsaj 3 igralci.', art: g => frame('#f08c2e', ICON.crown(), g) }
  ] });
  add({ id: 'zve', name: 'Zvestoba', desc: 'Šolski dnevi zapored. Vikendi in počitnice niza ne prekinejo.', stickers: [
    { id: 'z0', label: 'Dobrodošlica', cond: 'Prijavi se prvič.', art: g => frame('#f4c542', ICON.hello(), g) },
    { id: 'z1', label: '3 dni', cond: 'Vadi 3 šolske dni zapored.', streak: 3, art: g => frame('#e0574f', ICON.flame('3'), g) },
    { id: 'z2', label: 'Cel teden', cond: 'Vadi 5 šolskih dni zapored.', streak: 5, art: g => frame('#e06fb4', ICON.flame('5'), g) },
    { id: 'z3', label: '10 dni', cond: 'Vadi 10 šolskih dni zapored.', streak: 10, art: g => frame('#8a6fe0', ICON.flame('10'), g) },
    { id: 'z4', label: '20 dni', cond: 'Vadi 20 šolskih dni zapored.', streak: 20, art: g => frame('#5a8fe0', ICON.flame('20'), g) },
    { id: 'z5', label: '50 dni vadbe', cond: 'Vadi 50 različnih dni (dan šteje, ko imaš vsaj 10 pravilnih).', days: 50, art: g => frame('#3f9a8a', ICON.calendar('50'), g) }
  ] });
  return pages;
}

/* ════════════════ STANJE ════════════════ */
const SEASONS = { 1: { name: 'Jesen', ico: '🍂' }, 2: { name: 'Zima', ico: '❄️' } };
const S = {
  srv: null, error: null,
  view: 'album', page: 'post', trying: null,
  look: { skin: '#f7d2b4', hair: '#5a3a24', eye: '#4a8a3c', style: 'kratki', form: 'm' },
  equip: {}, active: 'vitez', seasonChar: 'vitez', coins: 0, owned: new Set(),
  album: buildAlbum()
};
const $ = id => document.getElementById(id);
const EQ = () => S.equip[S.active] || (S.equip[S.active] = {});
const ALL = () => S.album.flatMap(p => p.stickers);
const owned = s => s.state === 'have' || s.state === 'gold';
const pageDone = p => p.stickers.every(owned);
const rot = s => ((s.no * 37) % 9 - 4) + 'deg';
const pad = n => '#' + String(n).padStart(2, '0');
const nSlic = n => n === 1 ? 'sličica' : n === 2 ? 'sličici' : n < 5 ? 'sličice' : 'sličic';
const seasonId = () => S.srv && S.srv.season ? S.srv.season.id : 1;
const rewardFor = page => Object.keys(ITEMS).find(id => ITEMS[id].reward && ITEMS[id].reward[0] === seasonId() && ITEMS[id].reward[1] === page
  && (!ITEMS[id].char || ITEMS[id].char === S.seasonChar));
function rankInfo(ch = S.active) {
  const n = (S.srv && S.srv.ranks && S.srv.ranks[ch]) || 0, r = CHARS[ch].ranks[F() ? 1 : 0], top = RANK_AT.length - 1;
  let i = 0; while (i < top && n >= RANK_AT[i + 1]) i++;
  return { n, i, name: r[i], next: r[i + 1], need: i < top ? RANK_AT[i + 1] - n : 0, frac: i < top ? (n - RANK_AT[i]) / (RANK_AT[i + 1] - RANK_AT[i]) : 1 };
}

/* Odgovor baze → stanje strani. Kliče se po vsakem klicu v bazo. */
function apply(st) {
  if (!st || st.unreachable) { S.error = 'Album se ni naložil. Preveri internetno povezavo in poskusi znova.'; return render(); }
  S.srv = st; S.error = null;
  S.coins = st.coins || 0;
  S.owned = new Set(st.items || []);
  S.seasonChar = st.char || 'vitez';
  const a = st.avatar || {};
  S.look = { skin: a.skin || S.look.skin, hair: a.hair || S.look.hair, eye: a.eye || S.look.eye, style: a.style || S.look.style, form: a.form || S.look.form };
  S.equip = a.equip || {};
  S.active = a.active_char || S.seasonChar;
  const got = {}; (st.stickers || []).forEach(x => { got[x.id] = x.gold ? 'gold' : x.state; });
  const tbl = {}; (st.tables || []).forEach(x => { tbl[x.op + x.t] = x; });
  const streak = (st.streak && st.streak.best) || 0, days = st.practice_days || 0, comp = st.comp || {}, bat = st.battle || {};
  ALL().forEach(s => {
    s.state = got[s.id] || 'none';
    if (s.t) {
      const x = tbl[s.op + s.t];
      /* natančni odstotki — zaokroži se samo za prikaz (89,7 % ni 90 %, kot pravi baza) */
      s.prog = x ? [+x.n, x.n ? x.c / x.n * 100 : 0, x.timed ? x.fast / x.timed * 100 : 0, +x.cover] : null;
    }
    if (s.streak) s.step = [Math.min(streak, s.streak), s.streak, 'dni zapored'];
    if (s.days) s.step = [Math.min(days, s.days), s.days, 'dni'];
    if (s.best) s.step = [Math.min(comp.best || 0, s.best), s.best, 'točk (tvoj rekord v sezoni)'];
    if (s.records) s.step = [Math.min(comp.records || 0, s.records), s.records, 'izboljšav'];
    if (s.battles) s.step = [Math.min(bat.battles || 0, s.battles), s.battles, 'bitk'];
    if (s.mates) s.step = [Math.min(bat.mates || 0, s.mates), s.mates, 'sošolcev'];
  });
  try { parent.albumChanged && parent.albumChanged(st); } catch (e) {}
  render();
}

/* Klic v bazo prek aplikacije (album.js: albumApi — supabaseRPC in prijavljen učenec). */
const api = () => { try { return parent.albumApi; } catch (e) { return null; } };
async function rpc(fn, extra) {
  const p = api() && api().profile();
  if (!p) { S.error = 'Za album se prijavi.'; render(); return null; }
  return api().rpc(fn, { p_student: p.id, ...(extra || {}) });
}
let saveTimer = null;
function saveAvatar() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const st = await rpc('album_set_avatar', { p_avatar: { ...S.look, active_char: S.active, equip: S.equip } });
    if (st && !st.unreachable) apply(st);
  }, 400);
}

/* ════════════════ IZRIS ════════════════ */
function previewEq() { const e = { ...EQ() }; if (S.trying) e[ITEMS[S.trying].slot] = S.trying; return e; }
/* Prvi štirje čini: 1–4 trakovi. Čini nad 30: zvezda in pike (1–3). */
function chevrons(i) {
  let s = `<svg class="chev" viewBox="0 0 40 40"><path d="M20 2 L36 8 L36 22 Q36 34 20 38 Q4 34 4 22 L4 8 Z" fill="${RANK_COLORS[i]}" stroke="${OL}" stroke-width="2.5"/>`;
  if (i < 4) s += Array.from({ length: i + 1 }, (_, k) => `<path d="M12 ${26 - k * 6} L20 ${21 - k * 6} L28 ${26 - k * 6}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  else s += star(20, 17, 9, '#fff6b0', 1.5) + Array.from({ length: i - 3 }, (_, k) => `<circle cx="${20 + (k - (i - 4) / 2) * 7}" cy="31" r="2.6" fill="#fff"/>`).join('');
  return s + `</svg>`;
}
function ladder() {
  const r = rankInfo(), names = CHARS[S.active].ranks[F() ? 1 : 0];
  openModal(`<h3>Pot čina: ${cname(S.active)}</h3><p>Vsaka sličica šteje. Čini nad 30 so za tiste, ki pri liku ostanejo več sezon.</p>
    <div class="checks">${names.map((nm, i) => `<div class="check" style="${i === r.i ? 'outline:2px solid var(--accent)' : ''}"><span>${chevrons(i).replace('class="chev"', 'width="26" height="26"')}</span><div><b>${nm}</b>${i === r.i ? ' · <b style="color:var(--accent)">ti</b>' : ''}<br><small style="color:var(--muted)">${RANK_AT[i]} sličic${i >= 4 ? ' · več sezon · lik dobi sijaj' : ''}</small></div></div>`).join('')}</div>
    <p>Imaš <b>${r.n}</b> ${nSlic(r.n)} s tem likom.</p><div class="btns"><button class="btn btn-main" data-do="close">V redu</button></div>`);
}

function renderHeader() {
  const se = S.srv && S.srv.season, info = se ? SEASONS[se.id] || {} : {};
  $('season').innerHTML = se
    ? `<span class="ico">${info.ico || '⭐'}</span><span>Sezona ${se.id}: ${se.name} · ${cname(S.active)} <small>· še ${se.days_left} ${se.days_left === 1 ? 'dan' : se.days_left === 2 ? 'dneva' : se.days_left < 5 ? 'dnevi' : 'dni'}</small></span>`
    : `<span class="ico">⭐</span><span>Brihtov album</span>`;
  $('wallet').innerHTML = `<span class="coin"></span><span id="coins">${S.coins}</span><small style="font-weight:600;color:var(--muted);font-size:.8rem">${cek(S.coins)}</small>`;
  const pend = ALL().filter(s => s.state === 'pending').length, b = $('envBtn');
  b.disabled = !pend; b.classList.toggle('pulse', !!pend);
  b.innerHTML = pend ? `✉ Nove sličice <span class="n">${pend}</span>` : '✉ Ni novih';
}

function renderStage() {
  const ri = rankInfo().i;
  /* Čini nad 30: okoli lika se pojavi sijaj (več iskric pri višjem činu). */
  const glow = ri >= 4 ? `<div class="aura"><svg viewBox="0 0 512 512"><circle cx="256" cy="270" r="200" fill="${RANK_COLORS[ri]}" opacity=".12"/>${[[90,120],[420,110],[70,300],[440,320],[150,60],[370,420],[120,430],[400,220],[256,30]].slice(0, (ri - 3) * 3).map(([x, y], k) => sparkle(x, y, 10 + (k % 3) * 4).replace('<path', `<path style="animation-delay:${k * .3}s"`)).join('')}</svg></div>` : '';
  $('stageSvg').innerHTML = hero(S.look, previewEq()) + glow;
  const t = S.trying && ITEMS[S.trying];
  $('tryingBadge').classList.toggle('on', !!t && EQ()[t.slot] !== S.trying);
  const r = rankInfo();
  $('rank').innerHTML = `${chevrons(r.i)}<div><b>${r.name}</b><small>${r.next ? `še ${r.need} ${nSlic(r.need)} do čina ${r.next}` : 'Najvišji čin!'}</small><div class="bar"><i style="width:${r.frac * 100}%"></i></div></div>`;
  const a = $('action');
  if (!t) { a.innerHTML = `<div class="hint">${S.view === 'trgovina' ? 'Tapni predmet, da ga preizkusiš.' : 'Sličice prinesejo cekine in višji čin.'}</div>`; return; }
  const own = S.owned.has(S.trying), on = EQ()[t.slot] === S.trying;
  let body;
  if (t.reward && !own) {
    const [rs, rp] = t.reward, later = rs > seasonId(), live = PAGES_LIVE.includes(rp);
    const pg = !later && live ? S.album.find(p => p.id === rp) : null;
    body = `<div class="act-note">${pg ? `Ni naprodaj — nagrada za polno stran <b>${pg.name}</b> (${pg.stickers.filter(owned).length}/${pg.stickers.length}).`
      : later ? `Pride v sezoni ${rs} (${(SEASONS[rs] || {}).name || ''}) — nagrada za polno stran <b>${PAGE_NAMES[rp]}</b>.`
      : rp === 'razred' ? 'Nagrada za ves razred, ko dosežete skupni cilj — kmalu.'
      : `Ni naprodaj — nagrada za polno stran <b>${PAGE_NAMES[rp]}</b>. Ta stran pride kmalu.`}</div>
      <div class="btns">${pg ? `<button class="btn btn-purple" data-go="${pg.id}">Pojdi na stran</button>` : ''}<button class="btn btn-soft" data-do="cancel">Zapri</button></div>`;
  } else if (!own) {
    const short = t.price - S.coins;
    body = `<div class="btns">${short > 0 ? `<button class="btn btn-main" disabled>Manjka še ${short} ${cek(short)}</button>` : `<button class="btn btn-main" data-do="buy">Kupi za ${t.price} ${cek(t.price)}</button>`}<button class="btn btn-soft" data-do="cancel">Prekliči</button></div>`;
  } else if (!on) body = `<div class="btns"><button class="btn btn-ok" data-do="wear">Obleči</button><button class="btn btn-soft" data-do="cancel">Zapri</button></div>`;
  else body = `<div class="btns">${SLOTS[t.slot].fixed ? `<button class="btn btn-main" disabled>Oblečeno</button>` : `<button class="btn btn-main" data-do="off">Sleči</button>`}<button class="btn btn-soft" data-do="cancel">Zapri</button></div>`;
  a.innerHTML = `<div class="act-title">${t.name} <span class="rar ${t.rarity}">${t.rarity}</span>${!own && !t.reward && t.price ? `<span class="price"><span class="coin"></span>${t.price}</span>` : ''}</div>${body}`;
}

function renderTabs() {
  $('mainTabs').innerHTML = [['album', '📒 Album'], ['trgovina', '🛡️ Oprema'], ['videz', '🙂 Moj videz'], ['liki', '⭐ Moji liki']]
    .map(([k, n]) => `<button class="mt ${S.view === k ? 'on' : ''}" data-view="${k}">${n}</button>`).join('');
}

function slotHTML(s) {
  const inner = owned(s) ? `<div class="st have" style="--rot:${rot(s)}">${s.art(s.state === 'gold')}</div>`
    : `<div class="st">${emptyArt(s.t ? s.label.replace(' ', '') : pad(s.no), s.state === 'pending' ? null : progOf(s))}${s.state === 'pending' ? '<div class="waiting"><span>✉ v ovojnici</span></div>' : ''}</div>`;
  return `<button class="slot" data-st="${s.id}" id="slot-${s.id}">${inner}<div class="lbl">${s.label}</div><div class="num">${pad(s.no)}</div></button>`;
}
/* Poštevanka: 4 pogoji (računi, odgovori, pravilni, hitri) — da / ne. Povprečje
   bi pokazalo 97 %, ko manjka en sam račun, in otrok bi mislil, da je opravil. */
const tableConds = s => { const [n, a, f, c] = s.prog || [0, 0, 0, 0]; return [c >= MIN_COVER, n >= MIN_N, n > 0 && a >= MIN_ACC, n > 0 && f >= MIN_FAST]; };
function progOf(s) {
  let p;
  if (s.t) return tableConds(s);
  else if (s.step) p = s.step[0] / s.step[1];
  else return null;
  /* NaN bi se narisal kot poln obroček — raje prazen. */
  return Number.isFinite(p) ? Math.max(0, Math.min(1, p)) : 0;
}
function rewardBox(p) {
  const id = rewardFor(p.id), done = pageDone(p), left = p.stickers.filter(s => !owned(s)).length;
  if (!id) return '';
  return `<button class="reward ${done ? 'open' : 'locked'}" data-try="${id}"><div class="pic">${itemPic(id, EQ())}</div><div><small>${done ? 'Odklenjeno!' : 'Ko je stran polna'}</small><b>${ITEMS[id].name}</b><small>${done ? 'Tvoje — v opremi.' : `še ${left} ${nSlic(left)}`}</small></div></button>`;
}

function renderAlbum() {
  const tabs = S.album.map(p => `<button class="tab ${S.page === p.id ? 'on' : ''} ${pageDone(p) ? 'full' : ''}" data-page="${p.id}">${p.name} <small>${p.stickers.filter(owned).length}/${p.stickers.length}</small></button>`).join('');
  const p = S.album.find(x => x.id === S.page) || S.album[0], h = p.stickers.filter(owned).length, n = p.stickers.length;
  const cols = n === 6 ? 'six' : n === 8 || n === 4 ? 'four' : '';
  const body = `<div class="page-head"><div><h1>${p.name}</h1><p class="desc">${p.desc}</p><div class="page-prog"><span>${h} / ${n}</span><div class="bar"><i style="width:${h / n * 100}%"></i></div></div></div>${rewardBox(p)}</div>`
    + (p.sections ? p.sections.map(([k, t]) => `<div class="section-title">${t}</div><div class="sgrid">${p.stickers.filter(s => s.sec === k).map(slotHTML).join('')}</div>`).join('')
                  : `<div class="sgrid ${cols}">${p.stickers.map(slotHTML).join('')}</div>`)
    + `<p class="shop-note" style="margin-top:18px">Stran Pogum pride kmalu.</p>`;
  $('view').innerHTML = `<nav class="tabs">${tabs}</nav><section class="page">${body}</section>`;
}

function renderShop() {
  const ids = Object.keys(ITEMS).filter(id => { const it = ITEMS[id]; return it.season <= seasonId() && (!it.char || it.char === S.active); });
  const order = ['obleka', 'glava', 'v-roki', 'scit', 'hrbet', 'spremljevalec', 'ozadje'];
  const groups = order.map(sl => [sl, ids.filter(id => ITEMS[id].slot === sl)]).filter(([, l]) => l.length);
  $('view').innerHTML = `<div class="panel"><p class="shop-note">Oprema za: <b>${cname(S.active)}</b>. Predmeti z oznako <span class="rar nagrada">nagrada</span> niso naprodaj — odklene jih polna stran albuma.</p>`
    + groups.map(([sl, l]) => `<div class="section-title">${SLOTS[sl].name}</div><div class="igrid">${l.map(id => {
      const it = ITEMS[id], own = S.owned.has(id), on = EQ()[it.slot] === id, lock = it.reward && !own;
      return `<button class="card ${S.trying === id ? 'sel' : ''} ${lock ? 'lock' : ''}" data-try="${id}"><div class="pic">${itemPic(id, EQ())}</div>
        ${on ? '<span class="tag on">Oblečeno</span>' : own ? '<span class="tag own">Tvoje</span>' : lock ? '<span class="tag lk">🔒 Nagrada</span>' : ''}
        <div class="nm">${it.name}</div><div class="row"><span class="rar ${it.rarity}">${it.rarity}</span>${own || lock ? '' : it.price ? `<span class="price"><span class="coin"></span>${it.price}</span>` : '<b style="color:var(--ok);font-size:.85rem">Brezplačno</b>'}</div></button>`;
    }).join('')}</div>`).join('') + `</div>`;
}

function renderLook() {
  const O = { skin: ['#f7d2b4', '#efc29e', '#d9a47c', '#c98d62', '#8d5a3b'], hair: ['#5a3a24', '#2b1d2e', '#d9a441', '#c0392b', '#8a8f9a', '#e9e4ef'], eye: ['#4a8a3c', '#2a7fcf', '#6a4fc0', '#7a4a2a', '#3a3a3a'] };
  const sw = k => O[k].map(v => `<button class="sw ${S.look[k] === v ? 'on' : ''}" data-look="${k}" data-val="${v}" style="background:${v}"></button>`).join('');
  const nm = CHARS[S.active].names;
  $('view').innerHTML = `<div class="panel looks"><h3>Moj lik je</h3><div class="sw-row">${['m', 'f'].map((v, i) => `<button class="chip ${S.look.form === v ? 'on' : ''}" data-look="form" data-val="${v}">${nm[i]}</button>`).join('')}</div><h3>Koža</h3><div class="sw-row">${sw('skin')}</div><h3>Barva las</h3><div class="sw-row">${sw('hair')}</div>
    <h3>Frizura</h3><div class="sw-row">${Object.keys(HAIR).map(v => `<button class="chip ${S.look.style === v ? 'on' : ''}" data-look="style" data-val="${v}">${HAIR[v].name}</button>`).join('')}</div>
    <h3>Oči</h3><div class="sw-row">${sw('eye')}</div><p class="shop-note" style="margin-top:14px">✓ Videz je brezplačen in velja za vse tvoje like.</p></div>`;
}

function renderChars() {
  const mine = (S.srv && S.srv.chars) || [];
  const cards = Object.entries(CHARS).map(([k, c]) => {
    const have = mine.includes(k), on = S.active === k;
    const preview = hero(S.look, have ? (S.equip[k] || {}) : { ...c.starter });
    if (!have) return `<div class="ch future"><div class="pic">${preview}</div><b>${cname(k)}</b><small>Sezona ${c.season}: ${(SEASONS[c.season] || {}).name || ''}</small><button class="btn btn-soft" disabled>Pride v sezoni ${c.season}</button></div>`;
    return `<div class="ch ${on ? 'on' : ''}"><div class="pic">${preview}</div><b>${cname(k)}</b><small>${on ? 'Aktiven lik' : rankInfo(k).name}</small>
      ${on ? '<button class="btn btn-ok" disabled>Igraš s tem likom</button>' : `<button class="btn btn-main" data-switch="${k}">Preklopi</button>`}</div>`;
  }).join('') + `<div class="ch future"><div class="pic">${hero(S.look, { obleka: 'oproda' })}</div><b>???</b><small>Sezona 3: pomlad</small><button class="btn btn-soft" disabled>Skrivnost</button></div>`;
  $('view').innerHTML = `<div class="panel"><div class="info">Vsaki dve meseci pride nov lik. Ob koncu sezone izbereš: ostaneš pri svojem liku ali začneš z novim. Stari liki ostanejo tvoji z vso opremo. Spremljevalci in svetovi so skupni vsem likom.</div><div class="chars">${cards}</div></div>`;
}

function render() {
  if (!S.srv || S.error) {
    $('view').innerHTML = `<div class="panel"><p class="shop-note" style="font-size:1rem">${S.error || 'Nalagam album …'}</p></div>`;
    if (S.error && S.srv) return;
    if (!S.srv) { $('stageSvg').innerHTML = hero(S.look, {}); return; }
  }
  if (!S.srv.season) {
    renderHeader(); renderTabs();
    $('stageSvg').innerHTML = hero(S.look, EQ());
    $('view').innerHTML = `<div class="panel"><p class="shop-note" style="font-size:1rem">Sezona se še ni začela. Kmalu!</p></div>`;
    return;
  }
  renderHeader(); renderStage(); renderTabs();
  ({ album: renderAlbum, trgovina: renderShop, videz: renderLook, liki: renderChars })[S.view]();
}

/* ════════════════ OKNA IN DEJANJA ════════════════ */
function openModal(html, wide) { $('box').className = 'box' + (wide ? ' wide' : ''); $('box').innerHTML = html; $('modal').classList.add('on'); }
function closeModal() { $('modal').classList.remove('on'); }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }
function bumpWallet(n) {
  const w = $('wallet'); w.classList.remove('bump'); void w.offsetWidth; w.classList.add('bump');
  if (n > 0) { const p = document.createElement('span'); p.className = 'plus'; p.textContent = `+${n}`; w.appendChild(p); setTimeout(() => p.remove(), 1100); }
}
function burst(el) {
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.width / 2, cols = ['#f4c542', '#f08c2e', '#6a4fc0', '#7fe0ff', '#ff7f8f'];
  for (let i = 0; i < 18; i++) { const d = document.createElement('span'), a = i / 18 * Math.PI * 2, dist = 50 + Math.random() * 40; d.className = 'burst'; d.style.left = cx + 'px'; d.style.top = cy + 'px'; d.style.background = cols[i % 5]; d.style.setProperty('--x', Math.cos(a) * dist + 'px'); d.style.setProperty('--y', Math.sin(a) * dist + 'px'); document.body.appendChild(d); setTimeout(() => d.remove(), 900); }
}
function confetti() {
  const cols = ['#f08c2e', '#f4c542', '#6a4fc0', '#3f9a5a', '#ff7f8f', '#7fe0ff'];
  for (let i = 0; i < 40; i++) { const p = document.createElement('span'), a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 280; p.className = 'confetti'; p.style.background = cols[i % 6]; p.style.setProperty('--x', Math.cos(a) * d + 'px'); p.style.setProperty('--y', Math.sin(a) * d - 120 + 'px'); p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg'); document.body.appendChild(p); setTimeout(() => p.remove(), 1300); }
}
/* Povezava "vadi" odpre vajo v aplikaciji (to okno je odprto čez njo). */
const practiceHref = (t, op) => `./?p=${t}&op=${op}&mode=tipkovnica`;

function stickerDetail(s) {
  if (s.state === 'pending') return openModal(`<div class="art">${emptyArt(pad(s.no), null)}</div><h3>${s.label}</h3><p>Ta sličica te že čaka v ovojnici!</p><div class="btns"><button class="btn btn-main" data-do="env">✉ Odpri ovojnico</button><button class="btn btn-soft" data-do="close">Zapri</button></div>`);
  if (owned(s)) return openModal(`<div class="art" style="transform:rotate(${rot(s)})">${s.art(s.state === 'gold')}</div><h3>${s.label}</h3><p>${s.t ? (s.state === 'gold' ? 'Zlata! Poštevanko znaš tudi po 14 dneh.' : 'Obvladaš jo! Ponovi jo čez 14 dni in sličica postane zlata (+20 cekinov).') : s.cond}</p><div class="btns"><button class="btn btn-main" data-do="close">Super</button></div>`);
  if (s.t) {
    const [n, a, f, c] = s.prog || [0, 0, 0, 0];
    const rows = [[c >= MIN_COVER, `Različnih računov: <b>${c} / 10</b> (vsi)`, c / MIN_COVER], [n >= MIN_N, `Odgovori: <b>${n}</b> (vsaj ${MIN_N})`, n / MIN_N], [n > 0 && a >= MIN_ACC, `Pravilni: <b>${Math.floor(a)} %</b> (vsaj ${MIN_ACC} %)`, a / MIN_ACC], [n > 0 && f >= MIN_FAST, `Hitri (pod 3 s): <b>${Math.floor(f)} %</b> (vsaj ${MIN_FAST} %)`, f / MIN_FAST]];
    const tip = n === 0 ? 'Začni na tipkovnici — kviz za sličice ne šteje.' : c < MIN_COVER ? `Manjka še ${MIN_COVER - c} ${MIN_COVER - c === 1 ? 'račun' : MIN_COVER - c === 2 ? 'računa' : MIN_COVER - c < 5 ? 'računi' : 'računov'} — vadi celo poštevanko, ne samo lahkih.` : n < MIN_N ? `Še ${MIN_N - n} ${MIN_N - n === 1 ? 'odgovor' : MIN_N - n === 2 ? 'odgovora' : MIN_N - n < 5 ? 'odgovori' : 'odgovorov'} — potem šteje.` : a < MIN_ACC ? 'Skoraj! Še malo bolj natančno.' : 'Pravilno že znaš — zdaj še hitreje.';
    return openModal(`<div class="art">${emptyArt(s.label.replace(' ', ''), progOf(s))}</div><h3>${s.label} — še vadiš</h3>
      <div class="checks">${rows.map(([ok, t, p]) => `<div class="check"><span class="ic ${ok ? 'y' : 'n'}">${ok ? '✓' : ''}</span><div>${t}<div class="bar"><i style="width:${Math.min(100, p * 100)}%"></i></div></div></div>`).join('')}</div>
      <div class="tip">${tip} Sličica prinese +${COIN_PER} ${cek(COIN_PER)}.</div><div class="btns"><a class="btn btn-main" href="${practiceHref(s.t, s.op)}" target="_top">Vadi ${s.label} zdaj</a><button class="btn btn-soft" data-do="close">Zapri</button></div>`);
  }
  const [a, b, unit] = s.step || [0, 1, ''];
  openModal(`<div class="art">${emptyArt(pad(s.no), s.step ? a / b : null)}</div><h3>${s.label}</h3><p>${s.cond}</p>
    ${s.step ? `<div class="checks"><div class="check"><span class="ic n"></span><div><b>${a} / ${b}</b> ${unit}<div class="bar"><i style="width:${a / b * 100}%"></i></div></div></div></div>` : ''}
    <div class="btns"><button class="btn btn-soft" data-do="close">V redu</button></div>`);
}

const envSvg = open => `<svg viewBox="0 0 220 160">${open ? part('M20 60 L110 6 L200 60 Z', '#e9b37a', { w: 4 }) : ''}${part('M20 60 L200 60 L200 150 L20 150 Z', '#f6cf9f', { w: 4, shadow: 'M110 60 L210 60 L210 160 L110 160 Z' })}${line('M20 150 L110 96 L200 150', 4)}${open ? '' : part('M20 60 L110 116 L200 60 Z', '#e9b37a', { w: 4 })}<circle cx="110" cy="${open ? 30 : 104}" r="16" fill="#e0574f" stroke="${OL}" stroke-width="3"/>${star(110, open ? 30 : 104, 8, '#f4c542', 1.5)}</svg>`;
function openEnvelope() {
  if (!ALL().some(s => s.state === 'pending')) return;
  openModal(`<div class="env-art shake" id="envArt">${envSvg(false)}</div><h3>Nova sličica!</h3><p>Zaslužena z veliko vaje. Čestitam!</p><div class="btns"><button class="btn btn-main" data-do="reveal">Odpri</button></div>`);
}
function reveal() {
  const s = ALL().find(x => x.state === 'pending'), p = S.album.find(x => x.id === s.page);
  openModal(`<div class="art reveal" style="width:190px;height:190px">${s.art(false)}</div><h3>${s.label}</h3><p>Stran <b>${p.name}</b> · ${pad(s.no)} · <b>+${COIN_PER} ${cek(COIN_PER)}</b></p><div class="btns"><button class="btn btn-main" data-do="stick" data-id="${s.id}">Prilepi v album</button></div>`);
}
async function stick(id) {
  const s = ALL().find(x => x.id === id), p = S.album.find(x => x.id === s.page), before = rankInfo(S.seasonChar).i, coins = S.coins;
  closeModal();
  const st = await rpc('album_stick', { p_sticker: id });
  if (!st || st.unreachable) return toast('Sličice ni bilo mogoče prilepiti. Poskusi znova.');
  S.view = 'album'; S.page = p.id; apply(st);
  const el = $('slot-' + id);
  if (el) { el.classList.add('stuck'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => burst(el), 350); }
  setTimeout(() => bumpWallet(S.coins - coins), 350);
  const after = rankInfo(S.seasonChar);
  if (st.unlocked) setTimeout(() => pageReward(p, st.unlocked), 1100);
  else if (after.i > before) setTimeout(() => { confetti(); toast(`Nov čin: ${after.name}!`); }, 900);
}
function pageReward(p, id) {
  confetti();
  openModal(`<div class="art bgd reveal" style="width:200px;height:200px">${itemPic(id, EQ())}</div><h3>Stran ${p.name} je polna!</h3><p>Odklenjeno: <b>${ITEMS[id].name}</b>. Tega ni mogoče kupiti — samo zaslužiti.</p>
    <div class="btns"><button class="btn btn-ok" data-do="wearNow" data-id="${id}">Obleci zdaj</button><button class="btn btn-soft" data-do="close">Kasneje</button></div>`);
}
function askBuy() {
  const it = ITEMS[S.trying];
  openModal(`<div class="art bgd">${itemPic(S.trying, EQ())}</div><h3>Kupiš ${acc(it)}?</h3><p>Stane ${it.price} ${cek(it.price)}. Ostalo ti bo <b>${S.coins - it.price} ${cek(S.coins - it.price)}</b>.</p><div class="btns"><button class="btn btn-main" data-do="confirm">Da, kupi</button><button class="btn btn-soft" data-do="close">Ne</button></div>`);
}
const BUY_ERR = { PREMALO: 'Premalo cekinov.', ZE_IMAS: 'To že imaš.', NI_NAPRODAJ: 'Tega ni mogoče kupiti.', NI_ZA_TVOJ_LIK: 'To ni za tvojega lika.' };
async function buy() {
  const id = S.trying, it = ITEMS[id];
  closeModal();
  const st = await rpc('album_buy', { p_item: id });
  if (!st || st.unreachable) return toast('Nakup ni uspel. Preveri povezavo in poskusi znova.');
  if (st.error) { apply(st); return toast(BUY_ERR[st.error] || 'Nakup ni uspel.'); }
  apply(st);
  EQ()[it.slot] = id; render(); saveAvatar();
  confetti(); bumpWallet(0); toast(`Kupljeno: ${it.name}`);
}

document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  if (e.target.closest('#rank') && S.srv && S.srv.season) return ladder();
  const b = e.target.closest('button');
  if (!b || !S.srv) return;
  if (b.id === 'envBtn') return openEnvelope();
  if (b.dataset.view) { S.view = b.dataset.view; if (b.dataset.view !== 'trgovina') S.trying = null; return render(); }
  if (b.dataset.page) { S.page = b.dataset.page; return render(); }
  if (b.dataset.st) return stickerDetail(ALL().find(s => s.id === b.dataset.st));
  if (b.dataset.try) { S.trying = S.trying === b.dataset.try ? null : b.dataset.try; return render(); }
  if (b.dataset.look) { S.look[b.dataset.look] = b.dataset.val; render(); return saveAvatar(); }
  if (b.dataset.go) { S.view = 'album'; S.page = b.dataset.go; S.trying = null; return render(); }
  if (b.dataset.switch) { S.active = b.dataset.switch; S.trying = null; toast(`Zdaj igraš kot ${cname(S.active).toLowerCase()}.`); render(); return saveAvatar(); }
  const it = S.trying && ITEMS[S.trying];
  switch (b.dataset.do) {
    case 'close': return closeModal();
    case 'env': return openEnvelope();
    case 'reveal': { const a = $('envArt'); a.classList.remove('shake'); a.innerHTML = envSvg(true); return setTimeout(reveal, 450); }
    case 'stick': return stick(b.dataset.id);
    case 'cancel': S.trying = null; break;
    case 'buy': return askBuy();
    case 'confirm': return buy();
    case 'wear': EQ()[it.slot] = S.trying; toast(`Oblečeno: ${it.name}`); saveAvatar(); break;
    case 'off': delete EQ()[it.slot]; S.trying = null; saveAvatar(); break;
    case 'wearNow': { const r = ITEMS[b.dataset.id]; EQ()[r.slot] = b.dataset.id; S.trying = null; closeModal(); toast(`Oblečeno: ${r.name}`); saveAvatar(); break; }
    case 'form': S.look.form = b.dataset.val; closeModal(); markFormChosen(); saveAvatar(); break;
    default: return;
  }
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* Prvi obisk: otrok izbere, kako se lik imenuje (vitez / vitezinja). Vpraša se
   enkrat na napravo; izbiro lahko kadarkoli spremeni v "Moj videz". */
const formKey = () => 'brihta_lik_oblika_' + ((api() && api().profile() && api().profile().id) || '');
function markFormChosen() { try { localStorage.setItem(formKey(), '1'); } catch (e) {} }
function askFormOnce() {
  let asked = false; try { asked = !!localStorage.getItem(formKey()); } catch (e) {}
  if (asked || !S.srv || !S.srv.season) return;
  const ch = S.seasonChar;
  openModal(`<h3>Kdo boš to ${(S.srv.season.name || '').toLowerCase() === 'jesen' ? 'jesen' : 'sezono'}?</h3><p>Izberi ime svojega lika. Spremeniš ga lahko kadarkoli v "Moj videz".</p>
    <div class="choose">${['m', 'f'].map((v, i) => `<div class="opt"><div class="pic">${hero(S.look, EQ())}</div><b>${CHARS[ch].names[i]}</b><button class="btn ${i ? 'btn-purple' : 'btn-main'}" data-do="form" data-val="${v}">Sem ${CHARS[ch].names[i].toLowerCase()}</button></div>`).join('')}</div>`, true);
}

/* Ob odprtju: baza preveri pogoje (nove sličice v ovojnico, zlate) in vrne stanje. */
async function load() {
  render();
  const st = await rpc('album_sync');
  apply(st);
  askFormOnce();
}
/* Za album.js: ponovno preverjanje ob odprtju in po vadbi; stanje za glavo na gumbu in lika med vadbo. */
window.albumReload = load;
window.S = S;
load();
</script>
